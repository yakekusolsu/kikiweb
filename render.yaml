services:
  - type: web
    name: kikiweb-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: CLIENT_ORIGIN
        sync: false
      - key: INGEST_TOKEN
        sync: false
      - key: LISTEN_TOKEN
        sync: false
      - key: TALK_TOKEN
        sync: false
      - key: DISCORD_CHAT_WEBHOOK_URL
        sync: false
      - key: DISCORD_CHAT_WEBHOOK_URLS
        sync: false
